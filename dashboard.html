<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard List - WD1-L5</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container wide-container">
        <h2>Registered Users List</h2>
        <p id="welcomeUser" style="margin-bottom: 1rem; font-weight: bold;"></p>
        
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data populated via JS -->
            </tbody>
        </table>

        <div style="margin-top: 1.5rem;">
            <button id="logoutBtn" style="background-color: var(--error-color);">Logout</button>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
